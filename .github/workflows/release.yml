name: PHP Core release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

concurrency:
  group: php-core-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'peanut-business/peanut-admin-core-php'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require an annotated release tag on the current main commit
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.([1-9][0-9]*))?$ ]] || {
            echo 'Expected a vX.Y.Z or vX.Y.Z-rc.N tag' >&2
            exit 1
          }
          git fetch --force --no-tags origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" == tag ]] || {
            echo 'Release tag must be annotated' >&2
            exit 1
          }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
          main_commit="$(git rev-parse refs/remotes/origin/main^{commit})"
          [[ "$tag_commit" == "$main_commit" && "$tag_commit" == "$GITHUB_SHA" ]] || {
            echo 'Release tag must point to the current main commit' >&2
            exit 1
          }
          php -r '$package=json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR); if (($package["name"] ?? null) !== "peanut-admin/core" || isset($package["version"])) exit(1);' || {
            echo 'Unexpected Composer package identity or embedded version' >&2
            exit 1
          }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:2.10.2
          coverage: none
      - name: Require a fixed successful qualification run
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN: ${{ vars.CORE_QUALIFICATION_RUN_ID }}
        run: |
          set -Eeuo pipefail
          [[ "$QUALIFICATION_RUN" =~ ^[1-9][0-9]*$ ]] || { echo 'Set CORE_QUALIFICATION_RUN_ID to the approved CI run' >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN" > "$RUNNER_TEMP/qualification-run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '.conclusion == "success" and .path == ".github/workflows/ci.yml" and .head_repository.full_name == $repo' "$RUNNER_TEMP/qualification-run.json"
      - uses: actions/download-artifact@v4
        with:
          name: php-core-qualified
          path: .local/release
          github-token: ${{ github.token }}
          run-id: ${{ vars.CORE_QUALIFICATION_RUN_ID }}
      - name: Verify qualified source, dependency lock and tools
        run: |
          CORE_RELEASE_VERSION="${GITHUB_REF_NAME#v}" ./scripts/release-identity verify
          cp .local/release/qualification-composer.lock composer.lock
          composer install --no-interaction --no-progress --prefer-dist --no-scripts
          cmp composer.lock .local/release/qualification-composer.lock
      - name: Confirm Packagist indexed this exact tag and source
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_commit="$(git rev-parse HEAD)"
          for attempt in {1..18}; do
            if curl --fail --silent --show-error \
              https://repo.packagist.org/p2/peanut-admin/core.json \
              --output "$RUNNER_TEMP/packagist-core.json" \
              && php -r '
                $data=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
                foreach ($data["packages"]["peanut-admin/core"] ?? [] as $package) {
                  if (ltrim($package["version"] ?? "", "v") === ltrim($argv[2], "v")) exit(0);
                }
                exit(1);
              ' "$RUNNER_TEMP/packagist-core.json" "$GITHUB_REF_NAME" "$expected_commit"; then
              CORE_RELEASE_VERSION="${GITHUB_REF_NAME#v}" ./scripts/release-identity public "$RUNNER_TEMP/packagist-core.json"
              ./scripts/verify-consumer --public
              echo "Packagist dist payload and locked native consumer matched $GITHUB_REF_NAME at $expected_commit"
              exit 0
            fi
            if [[ "$attempt" -lt 18 ]]; then sleep 20; fi
          done
          echo 'Packagist did not expose the exact tagged source; check its package source and GitHub hook' >&2
          exit 1
      - name: Publish GitHub Release after Packagist verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then release_flags+=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,isPrerelease \
            > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            expected_prerelease=false
            if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then expected_prerelease=true; fi
            jq -e --arg tag "$GITHUB_REF_NAME" --argjson prerelease "$expected_prerelease" \
              '.tagName == $tag and .isDraft == false and .isPrerelease == $prerelease' \
              "$RUNNER_TEMP/release.json" >/dev/null
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag "${release_flags[@]}" \
            --title "Peanut Admin PHP Core $GITHUB_REF_NAME" --generate-notes
